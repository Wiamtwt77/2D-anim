<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>Twencraft Studio - True Free Joint Network</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body { font-family: system-ui, -apple-system, sans-serif; background: #0a0b0e; color: #e2e8f0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

    header { background: #14161f; padding: 8px 16px; border-bottom: 1px solid #1f2333; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; z-index: 10; }
    .tool-group { display: flex; gap: 6px; align-items: center; }
    
    button { background: #1f2333; border: 1px solid #30364f; color: #fff; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 600; transition: all 0.2s; }
    button:hover { background: #2c324a; transform: translateY(-1px); }
    button.active { background: #3b82f6; border-color: #60a5fa; color: #fff; box-shadow: 0 0 10px rgba(59,130,246,0.4); }
    button.accent { background: #10b981; border-color: #34d399; }
    button.danger { background: #ef4444; border-color: #f87171; }
    input[type="number"], input[type="text"], select { background: #0e1017; border: 1px solid #30364f; color: #fff; padding: 5px; border-radius: 4px; text-align: center; font-size: 12px; }

    .workspace { flex: 1; display: flex; position: relative; overflow: hidden; }
    .canvas-container { flex: 1; background: #050608; display: flex; justify-content: center; align-items: center; position: relative; overflow: auto; padding: 10px; }
    canvas { background: #0e1017; border-radius: 6px; box-shadow: 0 10px 30px rgba(0,0,0,0.9); cursor: crosshair; }

    .sidebar { width: 320px; background: #14161f; border-left: 1px solid #1f2333; display: flex; flex-direction: column; gap: 10px; padding: 12px; overflow-y: auto; z-index: 20; }
    .sidebar h4 { font-size: 12px; color: #60a5fa; border-bottom: 1px solid #1f2333; padding-bottom: 4px; margin-top: 4px; }
    .field { display: flex; justify-content: space-between; align-items: center; font-size: 11px; margin-bottom: 4px; }
    
    .scene-card { background: #1a1e2c; padding: 8px; border-radius: 6px; border: 1px solid #30364f; display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; cursor: pointer; }
    .scene-card.active { border-color: #3b82f6; background: #22283d; }

    .director-panel { height: 210px; background: #14161f; border-top: 1px solid #1f2333; padding: 10px 16px; display: flex; flex-direction: column; gap: 6px; z-index: 10; }
    .timeline-controls { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
    
    .tracks-container { position: relative; display: flex; flex-direction: column; gap: 4px; flex: 1; margin-top: 4px; overflow-x: auto; }
    .track-label { font-size: 10px; color: #94a3b8; display: flex; justify-content: space-between; align-items: center; }
    .track { position: relative; height: 30px; background: #0a0b0e; border: 1px solid #1f2333; border-radius: 4px; cursor: pointer; overflow: hidden; width: 100%; }
    .scrubber { position: absolute; top: 0; width: 2px; height: 100%; background: #ef4444; pointer-events: none; z-index: 20; box-shadow: 0 0 6px #ef4444; }
    
    .kf-node { position: absolute; top: 50%; width: 9px; height: 9px; background: #3b82f6; border-radius: 50%; transform: translate(-50%, -50%); z-index: 5; }
    .nle-clip { position: absolute; top: 2px; height: 24px; border-radius: 4px; cursor: grab; z-index: 6; display: flex; align-items: center; padding: 0 6px; font-size: 10px; color: #fff; font-weight: bold; overflow: hidden; white-space: nowrap; border: 1px solid rgba(255,255,255,0.2); }
    .audio-clip-item { background: rgba(239, 68, 68, 0.6); border-color: #ef4444; }
    .expr-clip-item { background: rgba(16, 185, 129, 0.6); border-color: #10b981; }

    .exp-box { background: #1a1e2c; padding: 8px; border-radius: 6px; border: 1px solid #30364f; display: flex; flex-direction: column; gap: 6px; }
  </style>
</head>
<body>

  <header>
    <div class="tool-group">
      <button id="btn-mode-pose" class="active" onclick="setMode('pose')">🖐️ تحريك المفاصل</button>
      <button id="btn-mode-draw" onclick="setMode('draw')">🦴 رسم حر ومشبكي</button>
      <button onclick="toggleBoneVisibility()">👁️ إخفاء الشبكة</button>
    </div>
    
    <div class="tool-group">
      <span style="font-size:11px;">المقاس:</span>
      <input type="number" id="canvas-width-input" value="800" step="50" style="width:50px;" onchange="resizeCanvas()">
      <span style="font-size:11px;">×</span>
      <input type="number" id="canvas-height-input" value="600" step="50" style="width:50px;" onchange="resizeCanvas()">
      <button onclick="document.getElementById('bg-file').click()">🖼️ خلفية</button>
      <input type="file" id="bg-file" accept="image/*" style="display:none;" onchange="uploadSceneBackground(event)">
    </div>

    <div class="tool-group">
      <button class="danger" onclick="deleteSelectedElement()">🗑️ حذف المحدد</button>
      <button onclick="clearLocalStorageData()" style="background:#334155; font-size:11px;">🔄 إعادة ضبط</button>
    </div>
  </header>

  <div class="workspace">
    <div class="canvas-container">
      <canvas id="stage" width="800" height="600"></canvas>
    </div>

    <!-- Sidebar & Properties Studio -->
    <div class="sidebar">
      <h4>🎬 تتابع المشاهد</h4>
      <div id="scenes-list"></div>
      <button onclick="addNewScene()" class="accent" style="width:100%;">➕ إضافة مشهد جديد</button>

      <div id="selected-panel" style="display:none; flex-direction:column; gap:8px; margin-top:8px;">
        <h4 id="panel-title">خصائص العنصر المحدد</h4>
        
        <button onclick="document.getElementById('bone-img-file').click()">📁 رفع صورة أساسية (Sprite)</button>
        <input type="file" id="bone-img-file" accept="image/*" style="display:none;" onchange="uploadBoneImage(event)">

        <h4>😊 مكتبة التعابير المتتابعة</h4>
        <div class="exp-box">
          <input type="text" id="new-exp-name" placeholder="اسم التعبير (مثال: غضب، كلام)">
          <button onclick="document.getElementById('exp-file').click()" style="background:#0284c7;">➕ رفع إطارات التعبير</button>
          <input type="file" id="exp-file" accept="image/*" multiple style="display:none;" onchange="createNewExpression(event)">
          
          <div style="margin-top: 4px;">
            <label style="font-size:10px; color:#a78bfa;">إضافة تعبير للمشهد:</label>
            <div style="display:flex; gap:4px; margin-top:3px;">
              <select id="select-clip-expr" style="flex:1;"></select>
              <input type="number" id="clip-duration-input" value="30" style="width:45px;" title="المدة بالأطر">
              <button onclick="addExpressionClip()" class="accent" style="padding:3px 6px;">إضافة</button>
            </div>
          </div>
        </div>

        <h4>📐 الأبعاد، الإزاحة ودوران السبرايت</h4>
        <div class="field"><label>العرض / الطول:</label>
          <div style="display:flex; gap:3px;">
            <input type="number" id="texW" style="width:55px;" oninput="updateTex()">
            <input type="number" id="texH" style="width:55px;" oninput="updateTex()">
          </div>
        </div>
        <div class="field"><label>إزاحة X / Y:</label>
          <div style="display:flex; gap:3px;">
            <input type="number" id="texOffX" style="width:45px;" oninput="updateTex()">
            <input type="number" id="texOffY" style="width:45px;" oninput="updateTex()">
          </div>
        </div>
        <div class="field"><label>زاوية السبرايت:</label>
          <input type="number" id="texAngle" style="width:60px;" oninput="updateTex()">
        </div>
      </div>
    </div>
  </div>

  <div class="director-panel">
    <div class="timeline-controls">
      <div class="tool-group">
        <button id="btn-play" onclick="togglePlay()" class="active" style="width: 85px;">▶ تشغيل</button>
        <button onclick="saveKeyframe()" class="accent">➕ حفظ لقطة</button>
        <button onclick="copyKeyframe()">📋 نسخ</button>
        <button onclick="pasteKeyframe()">📌 لصق</button>
        <button class="danger" onclick="deleteKeyframe()">🗑️ حذف لقطة</button>
      </div>

      <div class="tool-group">
        <span style="font-size:10px; color:#94a3b8;">الحركة:</span>
        <select id="easing-select" onchange="saveProjectState()">
          <option value="smooth">ناعم (Smooth)</option>
          <option value="linear">خطي (Linear)</option>
          <option value="easeIn">تسارع (Ease In)</option>
          <option value="easeOut">تباطؤ (Ease Out)</option>
          <option value="bounce">ارتداد (Bounce)</option>
        </select>
        <span style="font-size:10px; color:#94a3b8;">الإطارات:</span>
        <input type="number" id="max-frames" value="120" min="20" step="10" style="width:50px;" onchange="updateTimelineScale()">
      </div>

      <div class="tool-group">
        <button onclick="recordAudioClip()" style="background:#ef4444; font-size:11px;">🎙️ تسجيل صوت</button>
      </div>

      <span style="font-size: 12px; font-weight:bold;">المشهد: <b id="lbl-scene" style="color:#38bdf8;">1</b> | الإطار: <b id="lbl-frame" style="color:#60a5fa; font-size:14px;">0</b></span>
    </div>
    
    <div class="tracks-container" id="tracks-scroll">
      <div class="track-label"><span>مسار الإطارات الرئيسية (Animation Keyframes)</span></div>
      <div class="track" id="main-track" onmousedown="startScrubbing(event)">
        <div class="scrubber" id="scrubber-line"></div>
      </div>

      <div class="track-label" style="margin-top:3px;"><span>مسار المقاطع الصوتية</span></div>
      <div class="track" id="audio-track"></div>

      <div class="track-label" style="margin-top:3px;"><span>مسار التعابير</span></div>
      <div class="track" id="expr-track"></div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('stage');
    const ctx = canvas.getContext('2d');

    let mode = 'pose'; // pose, draw
    let showBones = true;
    
    let scenes = [
      { id: 'scene_1', title: 'المشهد الأول 🎬', duration: 120, bgImgSrc: null, joints: [], bones: [], keyframes: [], expressionClips: [], audioClips: [] }
    ];
    let currentSceneId = 'scene_1';

    let selectedBoneId = null;
    let selectedJointId = null;
    let currentFrame = 0;
    let maxFrames = 120;
    let playSpeed = 30;
    let lastTimestamp = 0;
    let isPlaying = false;
    let copiedKeyframeData = null;

    let isInteracting = false;
    let isScrubbing = false;
    let drawStartJoint = null;
    let mousePos = { x: 0, y: 0 };
    let draggingAudioId = null;
    let audioDragStartX = 0;
    let draggingExprClipId = null;
    let exprDragStartX = 0;
    let draggingJointId = null;

    class Joint {
      constructor(id, x, y) {
        this.id = id; this.x = x; this.y = y;
      }
    }

    class Bone {
      constructor(id, j1Id, j2Id) {
        this.id = id; this.j1Id = j1Id; this.j2Id = j2Id;
        this.baseImage = null;
        this.imgW = 100; this.imgH = 100;
        this.imgOffX = 0; this.imgOffY = 0;
        this.imgAngle = 0;
        this.expressions = {};
        this.activeExpression = "default";
      }
    }

    function getCurrentScene() {
      return scenes.find(s => s.id === currentSceneId) || scenes[0];
    }

    function saveProjectState() {
      const scene = getCurrentScene();
      scene.duration = maxFrames;
      localStorage.setItem('twencraft_joint_network_project', JSON.stringify({ scenes, currentSceneId }));
    }

    function loadProjectState() {
      const saved = localStorage.getItem('twencraft_joint_network_project');
      if (!saved) return;
      try {
        const data = JSON.parse(saved);
        if (data.scenes) {
          scenes = data.scenes.map(sd => ({
            id: sd.id, title: sd.title, duration: sd.duration || 120,
            bgImgSrc: sd.bgImgSrc, keyframes: sd.keyframes || [],
            expressionClips: sd.expressionClips || [], audioClips: sd.audioClips || [],
            joints: (sd.joints || []).map(jd => new Joint(jd.id, jd.x, jd.y)),
            bones: (sd.bones || []).map(bd => {
              let b = new Bone(bd.id, bd.j1Id, bd.j2Id);
              b.imgW = bd.imgW; b.imgH = bd.imgH; b.imgOffX = bd.imgOffX; b.imgOffY = bd.imgOffY;
              b.imgAngle = bd.imgAngle || 0;
              b.activeExpression = bd.activeExpression || "default";
              if (bd.baseImageSrc) { let im = new Image(); im.src = bd.baseImageSrc; b.baseImage = im; }
              if (bd.expressions) {
                b.expressions = {};
                Object.keys(bd.expressions).forEach(k => {
                  b.expressions[k] = bd.expressions[k].map(src => { let im = new Image(); im.src = src; return im; });
                });
              }
              return b;
            })
          }));
          currentSceneId = data.currentSceneId || scenes[0].id;
        }
      } catch(e) { console.error("Error loading:", e); }
      maxFrames = getCurrentScene().duration || 120;
      document.getElementById('max-frames').value = maxFrames;
      renderScenesList();
      updateTimelineScale();
    }

    function clearLocalStorageData() {
      if(confirm("هل تريد إعادة ضبط المشروع بالكامل؟")) {
        localStorage.removeItem('twencraft_joint_network_project');
        location.reload();
      }
    }

    function renderScenesList() {
      const list = document.getElementById('scenes-list');
      list.innerHTML = '';
      scenes.forEach((s) => {
        const div = document.createElement('div');
        div.className = `scene-card ${s.id === currentSceneId ? 'active' : ''}`;
        div.innerHTML = `<span>🎬 ${s.title}</span> <span style="font-size:10px; color:#94a3b8;">${s.duration} إطار</span>`;
        div.onclick = () => switchScene(s.id);
        list.appendChild(div);
      });
    }

    function addNewScene() {
      const id = 'scene_' + Date.now();
      scenes.push({ id, title: `مشهد ${scenes.length + 1}`, duration: 120, bgImgSrc: null, joints: [], bones: [], keyframes: [], expressionClips: [], audioClips: [] });
      switchScene(id);
      saveProjectState();
    }

    function switchScene(id) {
      currentSceneId = id;
      const s = getCurrentScene();
      maxFrames = s.duration || 120;
      document.getElementById('max-frames').value = maxFrames;
      currentFrame = 0;
      selectedBoneId = null;
      selectedJointId = null;
      document.getElementById('selected-panel').style.display = 'none';
      renderScenesList();
      updateTimelineScale();
      saveProjectState();
    }

    function engineLoop(timestamp) {
      if (!lastTimestamp) lastTimestamp = timestamp;
      const dt = (timestamp - lastTimestamp) / 1000;
      lastTimestamp = timestamp;

      if (isPlaying) {
        currentFrame += dt * playSpeed;
        if (currentFrame > maxFrames) {
          const currentIndex = scenes.findIndex(s => s.id === currentSceneId);
          if (currentIndex < scenes.length - 1) {
            currentSceneId = scenes[currentIndex + 1].id;
            maxFrames = getCurrentScene().duration;
            document.getElementById('max-frames').value = maxFrames;
            currentFrame = 0;
            renderScenesList();
            updateTimelineScale();
          } else {
            currentSceneId = scenes[0].id;
            maxFrames = getCurrentScene().duration;
            document.getElementById('max-frames').value = maxFrames;
            currentFrame = 0;
            renderScenesList();
            updateTimelineScale();
          }
        }
        evaluateFrame(currentFrame);
        updateUIProgress();
      }
      
      drawStage();
      requestAnimationFrame(engineLoop);
    }
    requestAnimationFrame(engineLoop);

    function applyEasing(t, type) {
      if (type === 'linear') return t;
      if (type === 'easeIn') return t * t;
      if (type === 'easeOut') return t * (2 - t);
      if (type === 'bounce') {
        const n1 = 7.5625, d1 = 2.75;
        if (t < 1 / d1) return n1 * t * t;
        if (t < 2 / d1) return n1 * (t -= 1.5 / d1) * t + 0.75;
        if (t < 2.5 / d1) return n1 * (t -= 2.25 / d1) * t + 0.9375;
        return n1 * (t -= 2.625 / d1) * t + 0.984375;
      }
      return t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t;
    }

    function evaluateFrame(frame) {
      const scene = getCurrentScene();
      scene.bones.forEach(b => {
        let activeClip = scene.expressionClips.find(c => c.boneId === b.id && frame >= c.startFrame && frame <= (c.startFrame + c.duration));
        if (activeClip) b.activeExpression = activeClip.exprName;
      });

      if (scene.keyframes.length === 0) return;
      let kf1 = scene.keyframes[0], kf2 = scene.keyframes[scene.keyframes.length - 1];
      for (let k of scene.keyframes) { if (k.frame <= frame) kf1 = k; }
      for (let i = scene.keyframes.length - 1; i >= 0; i--) { if (scene.keyframes[i].frame >= frame) kf2 = scene.keyframes[i]; }

      const easingType = document.getElementById('easing-select').value;

      scene.joints.forEach(j => {
        const s1 = kf1.joints[j.id], s2 = kf2.joints[j.id];
        if (s1 && s2 && kf1.frame !== kf2.frame) {
          const t = Math.max(0, Math.min(1, (frame - kf1.frame) / (kf2.frame - kf1.frame)));
          const smoothT = applyEasing(t, easingType);
          j.x = s1.x + (s2.x - s1.x) * smoothT;
          j.y = s1.y + (s2.y - s1.y) * smoothT;
        } else if (s1) {
          j.x = s1.x; j.y = s1.y;
        }
      });
    }

    function getMouse(e) {
      const rect = canvas.getBoundingClientRect();
      return { x: (e.clientX - rect.left) * (canvas.width / rect.width), y: (e.clientY - rect.top) * (canvas.height / rect.height) };
    }

    canvas.addEventListener('mousedown', (e) => {
      mousePos = getMouse(e);
      isInteracting = true;
      const scene = getCurrentScene();

      if (mode === 'draw') {
        // البحث عن مفصل قريب للبدء منه، أو إنشاء مفصل جديد حر تماماً
        let foundJoint = scene.joints.find(j => Math.hypot(mousePos.x - j.x, mousePos.y - j.y) < 18);
        if (!foundJoint) {
          foundJoint = new Joint('j_' + Date.now(), mousePos.x, mousePos.y);
          scene.joints.push(foundJoint);
        }
        drawStartJoint = foundJoint;
      } else {
        // وضع التحريك: فحص هل ضغطنا على مفصل أو عظمة
        selectedBoneId = null;
        selectedJointId = null;

        for (let j of scene.joints) {
          if (Math.hypot(mousePos.x - j.x, mousePos.y - j.y) < 18) {
            selectedJointId = j.id;
            draggingJointId = j.id;
            syncUI();
            return;
          }
        }

        for (let b of scene.bones) {
          const j1 = scene.joints.find(j => j.id === b.j1Id);
          const j2 = scene.joints.find(j => j.id === b.j2Id);
          if (!j1 || !j2) continue;
          // فحص المسافة لخط العظمة
          const midX = (j1.x + j2.x) / 2, midY = (j1.y + j2.y) / 2;
          if (Math.hypot(mousePos.x - midX, mousePos.y - midY) < 25) {
            selectedBoneId = b.id;
            syncUI();
            break;
          }
        }
        if (!selectedBoneId && !selectedJointId) {
          document.getElementById('selected-panel').style.display = 'none';
        }
      }
    });

    canvas.addEventListener('mousemove', (e) => {
      mousePos = getMouse(e);
      if (isInteracting && mode === 'pose' && draggingJointId) {
        const scene = getCurrentScene();
        const j = scene.joints.find(x => x.id === draggingJointId);
        if (j) {
          j.x = mousePos.x;
          j.y = mousePos.y;
          autoUpdateKeyframe();
        }
      }
    });

    canvas.addEventListener('mouseup', () => {
      if (!isInteracting) return;
      isInteracting = false;
      draggingJointId = null;
      const scene = getCurrentScene();

      if (mode === 'draw' && drawStartJoint) {
        let endJoint = scene.joints.find(j => Math.hypot(mousePos.x - j.x, mousePos.y - j.y) < 18);
        if (!endJoint) {
          endJoint = new Joint('j_' + Date.now(), mousePos.x, mousePos.y);
          scene.joints.push(endJoint);
        }
        if (drawStartJoint.id !== endJoint.id) {
          const nb = new Bone('b_' + Date.now(), drawStartJoint.id, endJoint.id);
          scene.bones.push(nb);
          selectedBoneId = nb.id;
          syncUI();
          saveProjectState();
        }
        drawStartJoint = null;
      }
    });

    let bgImgObj = null;
    function drawStage() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const scene = getCurrentScene();

      if (scene.bgImgSrc) {
        if (!bgImgObj || bgImgObj.src !== scene.bgImgSrc) {
          bgImgObj = new Image(); bgImgObj.src = scene.bgImgSrc;
        }
        if (bgImgObj.complete) ctx.drawImage(bgImgObj, 0, 0, canvas.width, canvas.height);
      }

      // رسم العظام والسبرايتات المرفقة
      scene.bones.forEach(b => {
        const j1 = scene.joints.find(j => j.id === b.j1Id);
        const j2 = scene.joints.find(j => j.id === b.j2Id);
        if (!j1 || !j2) return;

        let img = b.baseImage;
        if (b.activeExpression !== "default" && b.expressions[b.activeExpression]) {
          const frames = b.expressions[b.activeExpression];
          if (frames.length > 0) {
            const seqIndex = Math.floor(currentFrame / 4) % frames.length;
            img = frames[seqIndex];
          }
        }

        if (img) {
          const midX = (j1.x + j2.x) / 2;
          const midY = (j1.y + j2.y) / 2;
          const angle = Math.atan2(j2.y - j1.y, j2.x - j1.x) * (180 / Math.PI);

          ctx.save();
          ctx.translate(midX, midY);
          ctx.rotate((angle * Math.PI) / 180);
          ctx.translate(b.imgOffX, b.imgOffY);
          ctx.rotate((b.imgAngle * Math.PI) / 180);
          ctx.drawImage(img, -b.imgW/2, -b.imgH/2, b.imgW, b.imgH);
          ctx.restore();
        }
      });

      // رسم خطوط الهيكل والمفاصل
      if (showBones) {
        scene.bones.forEach(b => {
          const j1 = scene.joints.find(j => j.id === b.j1Id);
          const j2 = scene.joints.find(j => j.id === b.j2Id);
          if (!j1 || !j2) return;

          const isSel = b.id === selectedBoneId;
          ctx.beginPath(); ctx.moveTo(j1.x, j1.y); ctx.lineTo(j2.x, j2.y);
          ctx.lineWidth = isSel ? 4 : 2; ctx.strokeStyle = isSel ? '#3b82f6' : 'rgba(148, 163, 184, 0.4)'; ctx.stroke();
        });

        scene.joints.forEach(j => {
          const isSel = j.id === selectedJointId;
          ctx.beginPath(); ctx.arc(j.x, j.y, isSel ? 6 : 4, 0, Math.PI*2);
          ctx.fillStyle = isSel ? '#60a5fa' : '#ffffff'; ctx.fill();
        });

        if (drawStartJoint && isInteracting) {
          ctx.beginPath(); ctx.moveTo(drawStartJoint.x, drawStartJoint.y); ctx.lineTo(mousePos.x, mousePos.y);
          ctx.strokeStyle = '#10b981'; ctx.lineWidth = 2; ctx.stroke();
        }
      }
    }

    function syncUI() {
      const scene = getCurrentScene();
      const panel = document.getElementById('selected-panel');
      
      if (selectedBoneId) {
        const b = scene.bones.find(x => x.id === selectedBoneId);
        if (!b) return;
        panel.style.display = 'flex';
        document.getElementById('panel-title').innerText = "خصائص العظمة والسبرايت";
        document.getElementById('texW').value = b.imgW; document.getElementById('texH').value = b.imgH;
        document.getElementById('texOffX').value = b.imgOffX; document.getElementById('texOffY').value = b.imgOffY;
        document.getElementById('texAngle').value = b.imgAngle;

        const sel = document.getElementById('select-clip-expr');
        sel.innerHTML = '';
        Object.keys(b.expressions).forEach(expName => {
          sel.innerHTML += `<option value="${expName}">${expName}</option>`;
        });
      } else if (selectedJointId) {
        panel.style.display = 'none'; // يمكن إضافة خصائص للمفصل هنا لاحقاً
      }
    }

    function uploadBoneImage(e) {
      const scene = getCurrentScene();
      const b = scene.bones.find(x => x.id === selectedBoneId); if (!b || !e.target.files[0]) return;
      const reader = new FileReader(); reader.onload = ev => {
        const img = new Image(); img.onload = () => {
          b.baseImage = img; b.imgW = img.width; b.imgH = img.height; syncUI(); saveProjectState();
        }; img.src = ev.target.result;
      }; reader.readAsDataURL(e.target.files[0]);
    }

    function createNewExpression(e) {
      const scene = getCurrentScene();
      const b = scene.bones.find(x => x.id === selectedBoneId);
      const name = document.getElementById('new-exp-name').value.trim();
      if (!b || !name || !e.target.files.length) return alert("اكتب اسم التعبير واختر الصور");
      
      b.expressions[name] = [];
      let loaded = 0;
      Array.from(e.target.files).forEach((file, i) => {
        const reader = new FileReader();
        reader.onload = ev => {
          const img = new Image(); img.onload = () => {
            b.expressions[name][i] = img; loaded++;
            if(loaded === e.target.files.length) { syncUI(); saveProjectState(); }
          }; img.src = ev.target.result;
        }; reader.readAsDataURL(file);
      });
      document.getElementById('new-exp-name').value = '';
    }

    function addExpressionClip() {
      const scene = getCurrentScene();
      const b = scene.bones.find(x => x.id === selectedBoneId);
      if (!b) return alert("اختر عظمة أولاً");
      const exprName = document.getElementById('select-clip-expr').value;
      const duration = parseInt(document.getElementById('clip-duration-input').value) || 30;
      if (!exprName) return alert("لا يوجد تعبير متاح");

      scene.expressionClips.push({
        id: 'expr_' + Date.now(),
        boneId: b.id,
        exprName: exprName,
        startFrame: Math.round(currentFrame),
        duration: duration
      });
      renderExpressionClips();
      saveProjectState();
    }

    function updateTex() {
      const scene = getCurrentScene();
      const b = scene.bones.find(x => x.id === selectedBoneId); if(!b) return;
      b.imgW = parseFloat(document.getElementById('texW').value); b.imgH = parseFloat(document.getElementById('texH').value);
      b.imgOffX = parseFloat(document.getElementById('texOffX').value); b.imgOffY = parseFloat(document.getElementById('texOffY').value);
      b.imgAngle = parseFloat(document.getElementById('texAngle').value) || 0;
      saveProjectState();
    }

    function saveKeyframe() {
      const scene = getCurrentScene();
      const jointStates = {};
      const intFrame = Math.round(currentFrame);
      scene.joints.forEach(j => { jointStates[j.id] = { x: j.x, y: j.y }; });
      scene.keyframes = scene.keyframes.filter(k => k.frame !== intFrame);
      scene.keyframes.push({ frame: intFrame, joints: jointStates });
      scene.keyframes.sort((a,b) => a.frame - b.frame);
      drawTimelineNodes();
      saveProjectState();
    }

    function copyKeyframe() {
      const scene = getCurrentScene();
      const intFrame = Math.round(currentFrame);
      const kf = scene.keyframes.find(k => k.frame === intFrame);
      if (!kf) return alert("لا توجد لقطة في هذا الإطار!");
      copiedKeyframeData = JSON.parse(JSON.stringify(kf.joints));
      alert("تم نسخ اللقطة!");
    }

    function pasteKeyframe() {
      if (!copiedKeyframeData) return alert("انسخ لقطة أولاً!");
      const scene = getCurrentScene();
      const intFrame = Math.round(currentFrame);
      scene.keyframes = scene.keyframes.filter(k => k.frame !== intFrame);
      scene.keyframes.push({ frame: intFrame, joints: copiedKeyframeData });
      scene.keyframes.sort((a,b) => a.frame - b.frame);
      drawTimelineNodes();
      saveProjectState();
      alert("تم لصق اللقطة!");
    }
    
    function autoUpdateKeyframe() {
      const scene = getCurrentScene();
      let kf = scene.keyframes.find(k => k.frame === Math.round(currentFrame));
      if (kf) {
        scene.joints.forEach(j => {
          if (!kf.joints[j.id]) kf.joints[j.id] = {};
          kf.joints[j.id] = { x: j.x, y: j.y };
        });
        saveProjectState();
      }
    }

    function deleteKeyframe() {
      const scene = getCurrentScene();
      scene.keyframes = scene.keyframes.filter(k => k.frame !== Math.round(currentFrame));
      drawTimelineNodes();
      saveProjectState();
    }

    function updateTimelineScale() {
      maxFrames = parseInt(document.getElementById('max-frames').value) || 120;
      getCurrentScene().duration = maxFrames;
      drawTimelineNodes();
      renderExpressionClips();
      renderAudioClips();
      saveProjectState();
    }

    async function recordAudioClip() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        const mediaRecorder = new MediaRecorder(stream);
        let chunks = [];
        mediaRecorder.ondataavailable = e => { if(e.data.size > 0) chunks.push(e.data); };
        mediaRecorder.onstop = () => {
          const blob = new Blob(chunks, { type: 'audio/webm' });
          const url = URL.createObjectURL(blob);
          const audio = new Audio(url);
          audio.onloadedmetadata = () => {
            const durFrames = Math.round(audio.duration * playSpeed);
            const scene = getCurrentScene();
            scene.audioClips.push({ id: 'audio_' + Date.now(), src: url, startFrame: Math.round(currentFrame), duration: durFrames });
            renderAudioClips();
            saveProjectState();
            alert("تم تسجيل المقطع الصوتي بنجاح!");
          };
        };
        mediaRecorder.start();
        setTimeout(() => { if(mediaRecorder.state === "recording") mediaRecorder.stop(); }, 5000);
        alert("جاري التسجيل لمدة 5 ثوانٍ...");
      } catch(err) { alert("يجب السماح بالمايكروفون"); }
    }

    function renderAudioClips() {
      const track = document.getElementById('audio-track');
      track.innerHTML = '';
      const scene = getCurrentScene();
      scene.audioClips.forEach(clip => {
        const div = document.createElement('div');
        div.className = 'nle-clip audio-clip-item';
        div.style.left = `${(clip.startFrame / maxFrames) * 100}%`;
        div.style.width = `${(clip.duration / maxFrames) * 100}%`;
        div.innerText = `🎵 صوت (${Math.round(clip.duration/playSpeed)}ث)`;
        div.onmousedown = (e) => { draggingAudioId = clip.id; audioDragStartX = e.clientX; e.stopPropagation(); };
        track.appendChild(div);
      });
    }

    function renderExpressionClips() {
      const track = document.getElementById('expr-track');
      track.innerHTML = '';
      const scene = getCurrentScene();
      scene.expressionClips.forEach(clip => {
        const div = document.createElement('div');
        div.className = 'nle-clip expr-clip-item';
        div.style.left = `${(clip.startFrame / maxFrames) * 100}%`;
        div.style.width = `${(clip.duration / maxFrames) * 100}%`;
        div.innerText = `😊 ${clip.exprName}`;
        div.onmousedown = (e) => { draggingExprClipId = clip.id; exprDragStartX = e.clientX; e.stopPropagation(); };
        track.appendChild(div);
      });
    }

    window.addEventListener('mousemove', e => {
      if (isScrubbing) scrubTo(e);
      if (draggingAudioId) {
        const scene = getCurrentScene();
        const clip = scene.audioClips.find(c => c.id === draggingAudioId);
        if (clip) {
          const w = document.getElementById('audio-track').clientWidth;
          clip.startFrame = Math.max(0, Math.min(maxFrames - clip.duration, clip.startFrame + ((e.clientX - audioDragStartX)/w)*maxFrames));
          audioDragStartX = e.clientX; renderAudioClips();
        }
      }
      if (draggingExprClipId) {
        const scene = getCurrentScene();
        const clip = scene.expressionClips.find(c => c.id === draggingExprClipId);
        if (clip) {
          const w = document.getElementById('expr-track').clientWidth;
          clip.startFrame = Math.max(0, Math.min(maxFrames - clip.duration, clip.startFrame + ((e.clientX - exprDragStartX)/w)*maxFrames));
          exprDragStartX = e.clientX; renderExpressionClips();
        }
      }
    });
    window.addEventListener('mouseup', () => { isScrubbing = false; draggingAudioId = null; draggingExprClipId = null; saveProjectState(); });

    function startScrubbing(e) { isScrubbing = true; scrubTo(e); }
    function scrubTo(e) {
      const rect = document.getElementById('main-track').getBoundingClientRect();
      let pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
      currentFrame = pct * maxFrames;
      updateUIProgress(); evaluateFrame(currentFrame);
    }

    function updateUIProgress() {
      document.getElementById('lbl-frame').innerText = Math.round(currentFrame);
      const sceneIndex = scenes.findIndex(s => s.id === currentSceneId) + 1;
      document.getElementById('lbl-scene').innerText = sceneIndex;
      document.getElementById('scrubber-line').style.left = `${(currentFrame / maxFrames) * 100}%`;
    }

    function drawTimelineNodes() {
      const scene = getCurrentScene();
      const track = document.getElementById('main-track');
      track.querySelectorAll('.kf-node').forEach(n => n.remove());
      scene.keyframes.forEach(k => {
        const n = document.createElement('div'); n.className = 'kf-node';
        n.style.left = `${(k.frame / maxFrames) * 100}%`; track.appendChild(n);
      });
    }

    function togglePlay() {
      isPlaying = !isPlaying;
      document.getElementById('btn-play').innerText = isPlaying ? "⏸ إيقاف" : "▶ تشغيل";
    }

    function setMode(m) {
      mode = m;
      document.querySelectorAll('header button[id^=btn-mode]').forEach(b => b.classList.remove('active'));
      document.getElementById(`btn-mode-${m}`).classList.add('active');
    }

    function toggleBoneVisibility() { showBones = !showBones; }
    function resizeCanvas() { canvas.width = document.getElementById('canvas-width-input').value; canvas.height = document.getElementById('canvas-height-input').value; }
    
    function deleteSelectedElement() {
      const scene = getCurrentScene();
      if (selectedBoneId) {
        scene.bones = scene.bones.filter(b => b.id !== selectedBoneId);
        selectedBoneId = null;
      } else if (selectedJointId) {
        // حذف المفصل وأي عظمة مرتبطة به
        scene.bones = scene.bones.filter(b => b.j1Id !== selectedJointId && b.j2Id !== selectedJointId);
        scene.joints = scene.joints.filter(j => j.id !== selectedJointId);
        selectedJointId = null;
      }
      document.getElementById('selected-panel').style.display = 'none';
      saveProjectState();
    }

    function uploadSceneBackground(e){
      const r = new FileReader(); r.onload = ev => { getCurrentScene().bgImgSrc = ev.target.result; saveProjectState(); }; r.readAsDataURL(e.target.files[0]);
    }

    window.onload = () => {
      loadProjectState();
      drawTimelineNodes();
      renderExpressionClips();
      renderAudioClips();
    };
  </script>
</body>
</html>
