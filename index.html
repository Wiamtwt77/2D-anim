<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>Twencraft Upload Studio - Pro Edition</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body { font-family: system-ui, -apple-system, sans-serif; background: #0f1015; color: #e2e8f0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

    header { background: #1a1b23; padding: 12px 20px; border-bottom: 1px solid #2e313d; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; z-index: 10; }
    .tool-group { display: flex; gap: 8px; align-items: center; }
    
    button { background: #2a2c37; border: 1px solid #3d4050; color: #fff; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 600; transition: all 0.2s; }
    button:hover { background: #373a4a; transform: translateY(-1px); }
    button.active { background: #3b82f6; border-color: #60a5fa; color: #fff; box-shadow: 0 0 10px rgba(59,130,246,0.3); }
    button.accent { background: #10b981; border-color: #34d399; }
    button.danger { background: #ef4444; border-color: #f87171; }
    input[type="number"], input[type="text"], select { background: #111217; border: 1px solid #3d4050; color: #fff; padding: 6px; border-radius: 4px; text-align: center; }

    .workspace { flex: 1; display: flex; position: relative; overflow: hidden; }
    .canvas-container { flex: 1; background: #090a0d; display: flex; justify-content: center; align-items: center; position: relative; overflow: auto; padding: 20px; }
    canvas { background: #14151c; border-radius: 4px; box-shadow: 0 10px 40px rgba(0,0,0,0.8); cursor: crosshair; }

    .context-panel { position: absolute; top: 20px; right: 20px; background: rgba(26, 27, 35, 0.95); backdrop-filter: blur(10px); padding: 16px; border-radius: 8px; border: 1px solid #2e313d; display: flex; flex-direction: column; gap: 12px; width: 340px; max-height: calc(100% - 40px); overflow-y: auto; z-index: 20; }
    .context-panel h4 { font-size: 13px; color: #60a5fa; border-bottom: 1px solid #2e313d; padding-bottom: 6px; margin-top: 6px; }
    .field { display: flex; justify-content: space-between; align-items: center; font-size: 12px; }
    .field input[type="range"] { width: 120px; cursor: pointer; }

    .timeline { height: 180px; background: #1a1b23; border-top: 1px solid #2e313d; padding: 12px 24px; display: flex; flex-direction: column; gap: 8px; z-index: 10; }
    .timeline-controls { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    
    .track-container { position: relative; display: flex; flex-direction: column; gap: 4px; flex: 1; margin-top: 8px; }
    .track { position: relative; height: 36px; background: #0f1015; border: 1px solid #2e313d; border-radius: 6px; cursor: pointer; overflow: hidden; width: 100%; }
    .audio-track { height: 24px; background: #1e1e24; border: 1px dashed #3d4050; border-radius: 4px; position: relative; overflow: hidden; }
    
    .scrubber { position: absolute; top: 0; width: 3px; height: 100%; background: #ef4444; pointer-events: none; z-index: 10; box-shadow: 0 0 8px #ef4444; }
    .kf-node { position: absolute; top: 50%; width: 12px; height: 12px; background: #3b82f6; border-radius: 50%; transform: translate(-50%, -50%); z-index: 4; box-shadow: 0 0 10px #3b82f6; }
    .audio-clip { position: absolute; top: 0; height: 100%; background: rgba(239, 68, 68, 0.4); border: 1px solid #ef4444; border-radius: 4px; cursor: grab; z-index: 5; display: flex; align-items: center; padding-left: 5px; font-size: 10px; color: #fff; }
    .audio-clip:active { cursor: grabbing; background: rgba(239, 68, 68, 0.6); }

    .exp-box { background: #1e202a; padding: 8px; border-radius: 6px; border: 1px solid #3d4050; display: flex; flex-direction: column; gap: 8px; }
  </style>
</head>
<body>

  <header>
    <div class="tool-group">
      <button id="btn-mode-pose" class="active" onclick="setMode('pose')">🖐️ تحريك الجسد</button>
      <button id="btn-mode-draw" onclick="setMode('draw')">🦴 رسم العظام</button>
      <button onclick="toggleBoneVisibility()">👁️ إخفاء العظام</button>
    </div>
    
    <div class="tool-group">
      <span style="font-size:12px;">المقاس:</span>
      <input type="number" id="canvas-width-input" value="800" step="50" style="width:60px;" onchange="resizeCanvas()">
      <span style="font-size:12px;">×</span>
      <input type="number" id="canvas-height-input" value="600" step="50" style="width:60px;" onchange="resizeCanvas()">
      <button onclick="document.getElementById('bg-file').click()" style="margin-right:10px;">🖼️ خلفية</button>
      <input type="file" id="bg-file" accept="image/*" style="display:none;" onchange="uploadBackground(event)">
    </div>

    <div class="tool-group">
      <button class="danger" onclick="deleteSelectedBone()">🗑️ حذف القطعة</button>
    </div>
  </header>

  <div class="workspace">
    <div class="canvas-container">
      <canvas id="stage" width="800" height="600"></canvas>

      <div class="context-panel" id="side-panel" style="display:none;">
        <h3 id="panel-title" style="font-size:14px;">إعدادات القطعة</h3>

        <h4>1. المظهر الأساسي</h4>
        <button onclick="document.getElementById('bone-img-file').click()">📁 رفع صورة ثابتة</button>
        <input type="file" id="bone-img-file" accept="image/*" style="display:none;" onchange="uploadBoneImage(event)">

        <h4>2. نظام التعبيرات (المتغيرات)</h4>
        <div class="exp-box">
          <input type="text" id="new-exp-name" placeholder="اسم التعبير (مثال: غضب، كلام)">
          <button onclick="document.getElementById('exp-file').click()" style="background:#0ea5e9;">➕ رفع صور متتابعة للتعبير</button>
          <input type="file" id="exp-file" accept="image/*" multiple style="display:none;" onchange="createNewExpression(event)">
          
          <div class="field" style="margin-top: 8px; border-top: 1px solid #3d4050; padding-top: 8px;">
            <label style="color:#a78bfa;">التعبير النشط:</label>
            <select id="active-exp-select" onchange="setActiveExpression()"></select>
          </div>
        </div>

        <h4>3. الأبعاد والتحويلات</h4>
        <div class="field"><label>العرض:</label><input type="number" id="texW" oninput="updateTex()"></div>
        <div class="field"><label>الطول:</label><input type="number" id="texH" oninput="updateTex()"></div>
        <div class="field"><label>إزاحة X/Y:</label>
          <div style="display:flex; gap:4px;">
            <input type="number" id="texOffX" style="width:50px;" oninput="updateTex()">
            <input type="number" id="texOffY" style="width:50px;" oninput="updateTex()">
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="timeline">
    <div class="timeline-controls">
      <div class="tool-group">
        <button id="btn-play" onclick="togglePlay()" class="active" style="width: 100px;">▶ تشغيل</button>
        <button onclick="saveKeyframe()" class="accent">➕ حفظ اللقطة</button>
        <button class="danger" onclick="deleteKeyframe()">🗑️ حذف اللقطة</button>
      </div>

      <div class="tool-group" style="background: #111217; padding: 4px 10px; border-radius: 6px; border: 1px solid #3d4050;">
        <span style="font-size:12px; color:#94a3b8;">إطارات الفيديو:</span>
        <input type="number" id="max-frames" value="100" min="10" step="10" style="width:70px;" onchange="updateTimelineScale()">
      </div>

      <div class="tool-group">
        <button id="btn-record" onclick="toggleRecording()" style="background:#ef4444; font-size:11px;">🎙️ تسجيل صوت</button>
      </div>

      <span style="font-size: 14px; font-weight:bold;">الإطار: <b id="lbl-frame" style="color:#60a5fa; font-size:16px;">0</b></span>
    </div>
    
    <div class="track-container">
      <div class="track" id="main-track" onmousedown="startScrubbing(event)">
        <div class="scrubber" id="scrubber-line"></div>
      </div>
      <div class="audio-track" id="audio-track">
        <div class="audio-clip" id="audio-clip" style="display:none; left: 0%; width: 0%;">صوت 🎵</div>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('stage');
    const ctx = canvas.getContext('2d');

    // System States
    let mode = 'pose';
    let bones = [];
    let selectedBoneId = null;
    let keyframes = [];
    let showBones = true;
    let bgImage = null;

    // Animation & Smoothness
    let isPlaying = false;
    let currentFrame = 0; // Float for sub-frame smoothness
    let maxFrames = 100;
    let playSpeed = 30; // 30 FPS playback speed
    let lastTimestamp = 0;
    let animationReq = null;

    // Interaction
    let isInteracting = false;
    let isScrubbing = false;
    let drawStartPos = null;
    let mousePos = { x: 0, y: 0 };
    let snapIndicator = null;

    // Audio System
    let mediaRecorder = null;
    let audioChunks = [];
    let audioPlayer = new Audio();
    let audioStartFrame = 0;
    let audioDurationFrames = 0;
    let isDraggingAudio = false;

    class Bone {
      constructor(id, parentId, x, y, length, angle) {
        this.id = id;
        this.parentId = parentId;
        // Local coordinates (Only used if no parent!)
        this.x = x; 
        this.y = y;
        this.length = length;
        this.angle = angle; // Angle relative to parent

        // World coordinates (Calculated dynamically)
        this.worldX = 0; this.worldY = 0; this.worldAngle = 0;
        this._updated = false;

        // Visuals
        this.baseImage = null;
        this.imgW = 100; this.imgH = 100;
        this.imgOffX = 0; this.imgOffY = 0;
        
        // Expressions System (Variable based)
        this.expressions = {}; // format: { "angry": [img1, img2], "talk": [img3, img4] }
        this.activeExpression = "default";
      }
    }

    // --- Core Engine & FK System ---
    function updateTransforms() {
      bones.forEach(b => b._updated = false);
      bones.forEach(b => calculateWorld(b));
    }

    function calculateWorld(bone) {
      if (bone._updated) return;
      if (bone.parentId) {
        const parent = bones.find(b => b.id === bone.parentId);
        if (parent) {
          calculateWorld(parent); // Ensure parent is updated first
          const parentRad = (parent.worldAngle * Math.PI) / 180;
          // STRICT FK: Child strictly attached to parent's end point
          bone.worldX = parent.worldX + Math.cos(parentRad) * parent.length;
          bone.worldY = parent.worldY + Math.sin(parentRad) * parent.length;
          bone.worldAngle = parent.worldAngle + bone.angle;
        }
      } else {
        // Root bones use their local x,y
        bone.worldX = bone.x;
        bone.worldY = bone.y;
        bone.worldAngle = bone.angle;
      }
      bone._updated = true;
    }

    // --- Main Loop (60FPS Buttery Smooth) ---
    function engineLoop(timestamp) {
      if (!lastTimestamp) lastTimestamp = timestamp;
      const dt = (timestamp - lastTimestamp) / 1000;
      lastTimestamp = timestamp;

      if (isPlaying) {
        currentFrame += dt * playSpeed;
        
        if (currentFrame > maxFrames) {
          currentFrame = 0;
          if (audioPlayer.src) { audioPlayer.pause(); audioPlayer.currentTime = 0; }
        }

        syncAudioPlayback();
        evaluateFrame(currentFrame);
        updateUIProgress();
      }
      
      updateTransforms();
      drawStage();
      animationReq = requestAnimationFrame(engineLoop);
    }
    requestAnimationFrame(engineLoop);

    function evaluateFrame(frame) {
      if (keyframes.length === 0) return;
      let kf1 = keyframes[0], kf2 = keyframes[keyframes.length - 1];
      for (let k of keyframes) { if (k.frame <= frame) kf1 = k; }
      for (let i = keyframes.length - 1; i >= 0; i--) { if (keyframes[i].frame >= frame) kf2 = keyframes[i]; }

      bones.forEach(b => {
        const s1 = kf1.states[b.id], s2 = kf2.states[b.id];
        if (s1 && s2 && kf1.frame !== kf2.frame) {
          const t = (frame - kf1.frame) / (kf2.frame - kf1.frame);
          // Easing (Smooth step)
          const smoothT = t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t; 
          
          if(!b.parentId) { // Interpolate position ONLY for root bones
            b.x = s1.x + (s2.x - s1.x) * smoothT;
            b.y = s1.y + (s2.y - s1.y) * smoothT;
          }
          
          // Interpolate angle for all (Fixes shortest path rotation)
          let dAngle = s2.angle - s1.angle;
          while(dAngle > 180) dAngle -= 360;
          while(dAngle < -180) dAngle += 360;
          b.angle = s1.angle + dAngle * smoothT;

          // Discrete state (Expression doesn't interpolate, it switches)
          b.activeExpression = s1.expr || "default"; 

        } else if (s1) {
          if(!b.parentId) { b.x = s1.x; b.y = s1.y; }
          b.angle = s1.angle;
          b.activeExpression = s1.expr || "default";
        }
      });
    }

    // --- Interaction (Mouse) ---
    function getMouse(e) {
      const rect = canvas.getBoundingClientRect();
      return { x: (e.clientX - rect.left) * (canvas.width / rect.width), y: (e.clientY - rect.top) * (canvas.height / rect.height) };
    }

    function getSnap(pos) {
      for (let b of bones) {
        const rad = (b.worldAngle * Math.PI) / 180;
        const eX = b.worldX + Math.cos(rad) * b.length, eY = b.worldY + Math.sin(rad) * b.length;
        if (Math.hypot(pos.x - eX, pos.y - eY) < 30) return { id: b.id, x: eX, y: eY };
      }
      return null;
    }

    canvas.addEventListener('mousedown', (e) => {
      mousePos = getMouse(e);
      isInteracting = true;
      if (mode === 'draw') {
        const snap = getSnap(mousePos);
        drawStartPos = snap ? { pid: snap.id, x: snap.x, y: snap.y } : { pid: null, x: mousePos.x, y: mousePos.y };
      } else {
        selectedBoneId = null;
        for (let b of bones) {
          const rad = (b.worldAngle * Math.PI) / 180;
          const midX = b.worldX + (Math.cos(rad) * b.length)/2, midY = b.worldY + (Math.sin(rad) * b.length)/2;
          if (Math.hypot(mousePos.x - b.worldX, mousePos.y - b.worldY) < 20 || Math.hypot(mousePos.x - midX, mousePos.y - midY) < (b.length/2)) {
            selectedBoneId = b.id; syncUI(); break;
          }
        }
        if(!selectedBoneId) document.getElementById('side-panel').style.display = 'none';
      }
    });

    canvas.addEventListener('mousemove', (e) => {
      mousePos = getMouse(e);
      snapIndicator = (mode === 'draw' && !isInteracting) ? getSnap(mousePos) : null;

      if (isInteracting && mode === 'pose' && selectedBoneId) {
        const bone = bones.find(b => b.id === selectedBoneId);
        if (bone) {
          if (!bone.parentId) {
            bone.x = mousePos.x; bone.y = mousePos.y;
          } else {
            const p = bones.find(b => b.id === bone.parentId);
            if (p) {
              const dx = mousePos.x - bone.worldX;
              const dy = mousePos.y - bone.worldY;
              bone.angle = (Math.atan2(dy, dx) * (180 / Math.PI)) - p.worldAngle;
            }
          }
          autoUpdateKeyframe(bone);
        }
      }
    });

    canvas.addEventListener('mouseup', () => {
      if (!isInteracting) return;
      isInteracting = false;
      if (mode === 'draw' && drawStartPos) {
        const dx = mousePos.x - drawStartPos.x, dy = mousePos.y - drawStartPos.y;
        const len = Math.hypot(dx, dy);
        if (len > 15) {
          let ang = Math.atan2(dy, dx) * (180 / Math.PI);
          if (drawStartPos.pid) { ang -= bones.find(b => b.id === drawStartPos.pid).worldAngle; }
          const nb = new Bone('b_' + Date.now(), drawStartPos.pid, drawStartPos.x, drawStartPos.y, len, ang);
          bones.push(nb); selectedBoneId = nb.id; syncUI();
        }
        drawStartPos = null;
      }
    });

    // --- Rendering ---
    function drawStage() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      if (bgImage) ctx.drawImage(bgImage, 0, 0, canvas.width, canvas.height);

      bones.forEach(b => {
        let img = b.baseImage;
        // Animated Expression Logic
        if (b.activeExpression !== "default" && b.expressions[b.activeExpression]) {
          const frames = b.expressions[b.activeExpression];
          if (frames.length > 0) {
            // Animate expression: switch frame every 4 timeline frames
            const seqIndex = Math.floor(currentFrame / 4) % frames.length;
            img = frames[seqIndex];
          }
        }

        if (img) {
          ctx.save();
          ctx.translate(b.worldX, b.worldY);
          ctx.rotate((b.worldAngle * Math.PI) / 180);
          ctx.translate(b.imgOffX, b.imgOffY);
          ctx.drawImage(img, -b.imgW/2, -b.imgH/2, b.imgW, b.imgH);
          ctx.restore();
        }
      });

      if (showBones) {
        bones.forEach(b => {
          const isSel = b.id === selectedBoneId;
          const rad = (b.worldAngle * Math.PI) / 180;
          const eX = b.worldX + Math.cos(rad) * b.length, eY = b.worldY + Math.sin(rad) * b.length;

          ctx.beginPath(); ctx.moveTo(b.worldX, b.worldY); ctx.lineTo(eX, eY);
          ctx.lineWidth = isSel ? 5 : 3; ctx.strokeStyle = isSel ? '#3b82f6' : 'rgba(148, 163, 184, 0.5)'; ctx.stroke();
          
          ctx.beginPath(); ctx.arc(b.worldX, b.worldY, 6, 0, Math.PI*2);
          ctx.fillStyle = !b.parentId ? '#ef4444' : '#fff'; ctx.fill();
        });

        if (snapIndicator) {
          ctx.beginPath(); ctx.arc(snapIndicator.x, snapIndicator.y, 10, 0, Math.PI*2);
          ctx.fillStyle = 'rgba(16, 185, 129, 0.6)'; ctx.fill();
        }
        if (drawStartPos && isInteracting) {
          ctx.beginPath(); ctx.moveTo(drawStartPos.x, drawStartPos.y); ctx.lineTo(mousePos.x, mousePos.y);
          ctx.strokeStyle = '#ef4444'; ctx.lineWidth = 2; ctx.stroke();
        }
      }
    }

    // --- Expressions & UI Panel ---
    function syncUI() {
      const b = bones.find(x => x.id === selectedBoneId);
      if (!b) return;
      document.getElementById('side-panel').style.display = 'flex';
      document.getElementById('texW').value = b.imgW; document.getElementById('texH').value = b.imgH;
      document.getElementById('texOffX').value = b.imgOffX; document.getElementById('texOffY').value = b.imgOffY;
      
      const sel = document.getElementById('active-exp-select');
      sel.innerHTML = '<option value="default">الافتراضي (ثابت)</option>';
      Object.keys(b.expressions).forEach(expName => {
        sel.innerHTML += `<option value="${expName}">${expName} (${b.expressions[expName].length} صور)</option>`;
      });
      sel.value = b.activeExpression;
    }

    function createNewExpression(e) {
      const b = bones.find(x => x.id === selectedBoneId);
      const name = document.getElementById('new-exp-name').value.trim();
      if (!b || !name || !e.target.files.length) return alert("يرجى كتابة اسم التعبير أولاً (مثلاً: غضب)");
      
      b.expressions[name] = [];
      let loaded = 0;
      Array.from(e.target.files).forEach((file, i) => {
        const reader = new FileReader();
        reader.onload = ev => {
          const img = new Image(); img.onload = () => {
            b.expressions[name][i] = img; loaded++;
            if(loaded === e.target.files.length) { b.activeExpression = name; syncUI(); autoUpdateKeyframe(b); }
          }; img.src = ev.target.result;
        }; reader.readAsDataURL(file);
      });
      document.getElementById('new-exp-name').value = '';
    }

    function setActiveExpression() {
      const b = bones.find(x => x.id === selectedBoneId);
      if(b) { b.activeExpression = document.getElementById('active-exp-select').value; autoUpdateKeyframe(b); }
    }

    function uploadBoneImage(e) {
      const b = bones.find(x => x.id === selectedBoneId); if (!b || !e.target.files[0]) return;
      const reader = new FileReader(); reader.onload = ev => {
        const img = new Image(); img.onload = () => {
          b.baseImage = img; b.imgW = img.width; b.imgH = img.height; syncUI(); autoUpdateKeyframe(b);
        }; img.src = ev.target.result;
      }; reader.readAsDataURL(e.target.files[0]);
    }

    function updateTex() {
      const b = bones.find(x => x.id === selectedBoneId); if(!b) return;
      b.imgW = parseFloat(document.getElementById('texW').value); b.imgH = parseFloat(document.getElementById('texH').value);
      b.imgOffX = parseFloat(document.getElementById('texOffX').value); b.imgOffY = parseFloat(document.getElementById('texOffY').value);
    }

    // --- Keyframes ---
    function saveKeyframe() {
      const state = {};
      const intFrame = Math.round(currentFrame);
      bones.forEach(b => { state[b.id] = { x: b.x, y: b.y, angle: b.angle, expr: b.activeExpression }; });
      keyframes = keyframes.filter(k => k.frame !== intFrame);
      keyframes.push({ frame: intFrame, states: state });
      keyframes.sort((a,b) => a.frame - b.frame); drawTimelineNodes();
    }
    
    function autoUpdateKeyframe(bone) {
      let kf = keyframes.find(k => k.frame === Math.round(currentFrame));
      if (kf && kf.states[bone.id]) { kf.states[bone.id] = { x: bone.x, y: bone.y, angle: bone.angle, expr: bone.activeExpression }; }
    }

    function deleteKeyframe() { keyframes = keyframes.filter(k => k.frame !== Math.round(currentFrame)); drawTimelineNodes(); }

    // --- Timeline & Audio Draggable UI ---
    function updateTimelineScale() {
      maxFrames = parseInt(document.getElementById('max-frames').value) || 100;
      drawTimelineNodes();
    }

    function startScrubbing(e) { isScrubbing = true; scrubTo(e); }
    window.addEventListener('mousemove', e => { if(isScrubbing) scrubTo(e); });
    window.addEventListener('mouseup', () => { isScrubbing = false; });
    
    function scrubTo(e) {
      const rect = document.getElementById('main-track').getBoundingClientRect();
      let pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
      currentFrame = pct * maxFrames;
      updateUIProgress(); evaluateFrame(currentFrame);
      if(audioPlayer.src) audioPlayer.currentTime = Math.max(0, (currentFrame - audioStartFrame) / playSpeed);
    }

    function updateUIProgress() {
      document.getElementById('lbl-frame').innerText = Math.round(currentFrame);
      document.getElementById('scrubber-line').style.left = `${(currentFrame / maxFrames) * 100}%`;
    }

    function drawTimelineNodes() {
      const track = document.getElementById('main-track');
      track.querySelectorAll('.kf-node').forEach(n => n.remove());
      keyframes.forEach(k => {
        const n = document.createElement('div'); n.className = 'kf-node'; 
        n.style.left = `${(k.frame / maxFrames) * 100}%`; track.appendChild(n);
      });
      updateAudioVisual();
    }

    function togglePlay() {
      isPlaying = !isPlaying;
      document.getElementById('btn-play').innerText = isPlaying ? "⏸ إيقاف" : "▶ تشغيل";
    }

    // Audio Recorder & Logic
    async function toggleRecording() {
      const btn = document.getElementById('btn-record');
      if (mediaRecorder && mediaRecorder.state === "recording") {
        mediaRecorder.stop();
        btn.innerText = "🎙️ تسجيل صوت"; btn.style.background = "#ef4444";
      } else {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          mediaRecorder = new MediaRecorder(stream);
          mediaRecorder.ondataavailable = e => { if(e.data.size > 0) audioChunks.push(e.data); };
          mediaRecorder.onstop = () => {
            const blob = new Blob(audioChunks, { type: 'audio/webm' });
            audioPlayer.src = URL.createObjectURL(blob);
            audioPlayer.onloadedmetadata = () => {
              audioDurationFrames = audioPlayer.duration * playSpeed;
              audioStartFrame = Math.round(currentFrame); 
              updateAudioVisual();
            };
            audioChunks = [];
          };
          mediaRecorder.start();
          btn.innerText = "⏹️ إيقاف التسجيل"; btn.style.background = "#3b82f6";
        } catch(err) { alert("يجب السماح بالمايكروفون"); }
      }
    }

    function syncAudioPlayback() {
      if (!audioPlayer.src) return;
      const expectedTime = (currentFrame - audioStartFrame) / playSpeed;
      if (expectedTime >= 0 && expectedTime <= audioPlayer.duration) {
        if (audioPlayer.paused) { audioPlayer.currentTime = expectedTime; audioPlayer.play().catch(()=>{}); }
      } else {
        if (!audioPlayer.paused) audioPlayer.pause();
      }
    }

    // Audio Draggable Block UI
    const audioClipDiv = document.getElementById('audio-clip');
    const audioTrackDiv = document.getElementById('audio-track');
    
    audioClipDiv.addEventListener('mousedown', (e) => { isDraggingAudio = true; e.stopPropagation(); });
    window.addEventListener('mousemove', (e) => {
      if (isDraggingAudio) {
        const rect = audioTrackDiv.getBoundingClientRect();
        let pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
        audioStartFrame = pct * maxFrames;
        updateAudioVisual();
      }
    });
    window.addEventListener('mouseup', () => { isDraggingAudio = false; });

    function updateAudioVisual() {
      if (!audioPlayer.src) { audioClipDiv.style.display = 'none'; return; }
      audioClipDiv.style.display = 'flex';
      audioClipDiv.style.left = `${(audioStartFrame / maxFrames) * 100}%`;
      audioClipDiv.style.width = `${(audioDurationFrames / maxFrames) * 100}%`;
    }

    // Setup Helpers
    function setMode(m) { mode = m; document.querySelectorAll('header button[id^=btn-mode]').forEach(b => b.classList.remove('active')); document.getElementById(`btn-mode-${m}`).classList.add('active'); }
    function toggleBoneVisibility() { showBones = !showBones; }
    function resizeCanvas() { canvas.width = document.getElementById('canvas-width-input').value; canvas.height = document.getElementById('canvas-height-input').value; }
    function deleteSelectedBone() { if(!selectedBoneId) return; const ids = new Set([selectedBoneId]); let add = true; while(add){ add=false; bones.forEach(b=>{if(ids.has(b.parentId)&&!ids.has(b.id)){ids.add(b.id);add=true;}}); } bones=bones.filter(b=>!ids.has(b.id)); selectedBoneId=null; document.getElementById('side-panel').style.display='none'; }
    function uploadBackground(e){ const r=new FileReader(); r.onload=ev=>{ const img=new Image(); img.onload=()=>bgImage=img; img.src=ev.target.result; }; r.readAsDataURL(e.target.files[0]); }
  </script>
</body>
